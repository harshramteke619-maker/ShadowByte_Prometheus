<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Everlearn.ai — Learn together, go further. Offline-first collaborative learning for every student." />
    <meta name="theme-color" content="#1a2744" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0f4c81" media="(prefers-color-scheme: light)" />

    <!-- Prevent FOUC: read saved theme BEFORE any paint -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ss-theme');
          var prefer = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = saved === 'dark' || saved === 'light' ? saved : prefer;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Everlearn.ai — Learn Together, Go Further</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
